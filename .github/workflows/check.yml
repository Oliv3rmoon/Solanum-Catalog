name: Check the catalog
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Catalog and every app's latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/check_catalog.py --online
